# keeper web (nginx, 비root uid 101, 8080 포트). /api 는 Ingress가 api 파드로 보내므로 여기로 오지 않는다.
server {
    listen 8080;
    root /usr/share/nginx/html;
    server_tokens off;                      # 오류 화면·헤더에 nginx 버전을 보이지 않음

    # 보안 헤더 (WEB 담당 보안 통제: XSS를 WAF와 화면 양쪽에서 막는 이중 방어)
    #  - CSP: 우리 서버의 스크립트·스타일만 실행. 인라인 스크립트 금지. 외부 연결은 Cognito 로그인(토큰 교환)만 허용
    #  - img-src blob: 서류 그림을 받아서 blob: 주소로 보여 주기 때문 / data: 체험 모드 샘플 그림
    #  - frame-ancestors 'none': 다른 사이트가 우리 화면을 iframe으로 감싸 클릭을 가로채지 못하게(클릭재킹)
    # 이 블록의 add_header는 location 안에 add_header가 없을 때만 이어진다. location에 add_header를 넣으면 여기 것도 다시 적어야 함
    # Cognito 로그인 주소는 와일드카드(*.amazoncognito.com) 대신 우리 풀의 주소 하나만 허용 (SOC 요청: 다른 계정 도메인 차단)
    # 값은 persistent/cognito.tf 의 로그인 도메인(keeper-login-<계정 끝 4자리>). 풀은 persistent에 고정이라 매일 바뀌지 않음
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob: data:; connect-src 'self' https://keeper-login-8996.auth.ap-northeast-2.amazoncognito.com; form-action 'self' https://keeper-login-8996.auth.ap-northeast-2.amazoncognito.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HSTS: 브라우저가 이 주소를 1년 동안 https로만 접속하게 기억함 (첫 http 요청도 막음)
    # TLS는 ALB가 끝내지만 헤더는 여기서 붙인다. http(ALB 주소)로 받은 HSTS는 브라우저가 무시하므로 해가 없음
    add_header Strict-Transport-Security "max-age=31536000" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # 화면(html)은 항상 새로 받게, js·css는 5분 캐시 (배포 직후 옛 화면이 남지 않게)
    location ~* \.html$ { expires -1; try_files $uri =404; }
    location ~* \.(js|css)$ { expires 5m; try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
