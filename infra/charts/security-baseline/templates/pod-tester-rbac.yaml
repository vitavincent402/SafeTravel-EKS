{{- /*
  RED 공격 시험용 권한. level=tester 인 팀원(EKS access entry의 kubernetes_groups)이 받는다.
  pods 만들기(create)만 허용한다. 시험하는 위험 파드(tests/attack)는 입장 정책·PSA가 거부해야 정상이고,
  서버 dry-run(--dry-run=server)도 create 권한이 있어야 검사를 받는다.
  주지 않는 것: Secret 조회, pods/exec, 삭제·수정, 다른 네임스페이스 쓰기.
  (조회는 AmazonEKSViewPolicy가 이미 줌)
*/ -}}
{{- if .Values.podTester.enabled }}
{{- range $ns := .Values.protectedNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keeper-pod-tester
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keeper-pod-tester
  namespace: {{ $ns }}
subjects:
  - kind: Group
    name: {{ $.Values.podTester.group }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: keeper-pod-tester
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
