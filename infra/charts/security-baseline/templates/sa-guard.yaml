{{- /*
  앱 서비스 어카운트(keeper-*) 도용 방지 정책.
  tester·developer 같은 사용자가 파드(또는 파드를 만드는 Deployment 등)에 keeper-api 같은 앱 서비스 어카운트를 붙여
  그 앱의 IRSA(IAM 역할) 권한을 얻는 경로를 막는다.
  - 파드 생성 주체는 replicaset-controller 같은 컨트롤러이므로, 파드뿐 아니라
    Deployment·ReplicaSet·StatefulSet·DaemonSet·Job·CronJob·ReplicationController 의 생성/수정에도 건다.
  - 허용: 컨트롤러(system:serviceaccount:kube-system:*), saGuard.deployers 에 적은 배포 주체(Helm 배포 파이프라인, Terraform 실행 계정)
  - saGuard.actions: [Warn, Audit] 이면 거부하지 않고 경고·감사 로그만(검증 기간), [Deny] 로 바꾸면 거부
  - serviceAccountName 과 구버전 필드 serviceAccount 둘 다 본다.
  NetworkPolicy는 라벨(만드는 쪽이 정함)로 동작하므로 이 경로의 방어선이 아니다.
*/ -}}
{{- if and .Values.admissionPolicies.enabled .Values.saGuard.enabled }}
{{- if not .Values.protectedNamespaces }}{{ fail "protectedNamespaces가 비어 있습니다" }}{{ end -}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: keeper-restrict-app-service-accounts
  annotations:
    keeper.io/title: "앱 서비스 어카운트(keeper-*)는 컨트롤러와 배포 주체만 사용"
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "replicationcontrollers"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: podSpec
      expression: "object.kind == 'Pod' ? object.spec : (object.kind == 'CronJob' ? object.spec.jobTemplate.spec.template.spec : object.spec.template.spec)"
    - name: saName
      expression: "has(variables.podSpec.serviceAccountName) ? variables.podSpec.serviceAccountName : ''"
    - name: saLegacy
      expression: "has(variables.podSpec.serviceAccount) ? variables.podSpec.serviceAccount : ''"
    - name: user
      expression: "request.userInfo.username"
  validations:
    - expression: >-
        !(variables.saName.startsWith('keeper-') || variables.saLegacy.startsWith('keeper-'))
        || variables.user.startsWith('system:serviceaccount:kube-system:')
        {{- range .Values.saGuard.deployers }}
        || variables.user.startsWith({{ . | squote }})
        {{- end }}
      message: "[keeper] 앱 서비스 어카운트(keeper-*)는 배포 파이프라인과 컨트롤러만 쓸 수 있습니다. serviceAccountName 을 지정하지 않으면 default 를 씁니다."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: keeper-restrict-app-service-accounts
spec:
  policyName: keeper-restrict-app-service-accounts
  validationActions:
    {{- range .Values.saGuard.actions }}
    - {{ . | quote }}
    {{- end }}
  matchResources:
    namespaceSelector:
      matchExpressions:
        - key: kubernetes.io/metadata.name
          operator: In
          values:
            {{- range .Values.protectedNamespaces }}
            - {{ . | quote }}
            {{- end }}
{{- end }}
