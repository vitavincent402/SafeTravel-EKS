{{- /*
  developer-nosecret 등급(DB 담당 등)이 받는 권한. AmazonEKSEditPolicy와 달리 Secret 조회를 뺀 keeper 네임스페이스 쓰기 권한.
  조회는 AmazonEKSViewPolicy(클러스터 전체, Secret 제외)가 이미 줌.
  주지 않는 것: secrets 전체, RBAC 수정, 다른 네임스페이스 쓰기.
*/ -}}
{{- if .Values.developerNoSecret.enabled }}
{{- range $ns := .Values.protectedNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keeper-developer-nosecret
  namespace: {{ $ns }}
rules:
  - apiGroups: [""]
    resources: [pods, pods/log, pods/exec, pods/portforward, services, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["apps"]
    resources: [deployments, deployments/scale, replicasets, statefulsets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["batch"]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keeper-developer-nosecret
  namespace: {{ $ns }}
subjects:
  - kind: Group
    name: {{ $.Values.developerNoSecret.group }}
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: keeper-developer-nosecret
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
