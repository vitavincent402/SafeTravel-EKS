{{- /*
  keeper 밖 네임스페이스(default, security-audit)의 기본 거부.
  keeper 네임스페이스에만 NetworkPolicy가 있으면 다른 네임스페이스의 파드가 노드 보안 그룹을 통해
  RDS(5432)에 닿는다. 이 두 네임스페이스에는 앱이 없으므로 들어오고 나가는 트래픽을 모두 막고 DNS만 허용한다.
  (kube-bench 점검 잡은 노드 파일을 읽을 뿐이라 네트워크가 필요 없다.)
  주의: VPC CNI는 파드가 뜬 직후 몇 초 동안은 정책이 아직 붙지 않을 수 있다. 시험할 때는 파드가 뜬 뒤 10초 이상 기다린다.
*/ -}}
{{- if .Values.networkIsolation.enabled }}
{{- range .Values.networkIsolation.namespaces }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: {{ . }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: {{ . }}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
{{- end }}
{{- end }}
{{- if and .Values.networkIsolation.enabled .Values.networkIsolation.apiServerCidrs }}
{{- if has "security-audit" .Values.networkIsolation.namespaces }}
---
# kube-bench는 정책 점검(CIS 5장)에서 쿠버네티스 API 서버를 조회한다. 기본 거부 때문에 API 서버로 못 나가면 점검이 끝나지 않으므로(11/26 확인)
# kube-bench 파드만 API 서버가 있는 프라이빗 서브넷의 443으로 나가게 허용한다. 데이터 서브넷(RDS 5432)은 여전히 막힌다.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-kube-bench-api
  namespace: security-audit
spec:
  podSelector:
    matchLabels: { app: kube-bench }
  policyTypes: ["Egress"]
  egress:
    - to:
        {{- range .Values.networkIsolation.apiServerCidrs }}
        - ipBlock: { cidr: {{ . }} }
        {{- end }}
      ports:
        - { protocol: TCP, port: 443 }
{{- end }}
{{- end }}
