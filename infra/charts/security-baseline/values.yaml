# Terraform(security.tf)이 채웁니다.
protectedNamespaces: []        # 정책을 적용할 네임스페이스
trustedRegistryPrefix: ""      # 예: 123456789012.dkr.ecr.ap-northeast-2.amazonaws.com/keeper/

admissionPolicies:
  enabled: true                # false면 입장 정책 4종을 만들지 않음 (Before 시연용)

kubeBench:
  enabled: true                # false면 kube-bench 정기 점검을 만들지 않음 (Before 시연용)
  image: docker.io/aquasec/kube-bench:v0.16.0
  benchmark: eks-1.8.0
  schedule: "0 3 * * *"        # 매일 03:00 UTC = 12:00 KST (클러스터가 켜져 있는 낮 시간)

podTester:
  enabled: true                # keeper-red(level=tester)가 위험 파드를 서버 dry-run으로 시험할 수 있게 Role을 만듦
  group: keeper-pod-tester     # EKS access entry의 kubernetes_groups 와 같아야 함

saGuard:
  enabled: true                # 앱 서비스 어카운트(keeper-*) 도용 방지 정책 (admissionPolicies.enabled 도 true 일 때)
  actions: ["Warn", "Audit"]   # 검증 기간. 정상 배포가 안 걸리면 ["Deny"] 로 전환
  deployers: []                # 앱 서비스 어카운트를 쓸 수 있는 사용자 이름 접두사 (Terraform이 채움)
