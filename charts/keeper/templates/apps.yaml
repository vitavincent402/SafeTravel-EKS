{{- /* web, api, vault 세 앱을 같은 틀로 만듭니다: ServiceAccount + Deployment + Service */ -}}
{{- $root := . -}}
{{- range $name, $app := .Values.apps }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: keeper-{{ $name }}
  labels:
    {{- include "keeper.labels" $root | nindent 4 }}
  {{- $sa := index $root.Values.serviceAccounts $name | default dict }}
  {{- if $sa.roleArn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $sa.roleArn }}   # IRSA: 이 앱만 받는 IAM 역할
  {{- end }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keeper-{{ $name }}
  labels:
    app: keeper-{{ $name }}
    {{- include "keeper.labels" $root | nindent 4 }}
spec:
  replicas: {{ $app.replicas }}
  {{- if $root.Values.rollout.enabled }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # 새 파드가 준비되기 전에는 옛 파드를 내리지 않음
      maxSurge: 1
  {{- end }}
  selector:
    matchLabels:
      app: keeper-{{ $name }}
  template:
    metadata:
      labels:
        app: keeper-{{ $name }}
        {{- include "keeper.labels" $root | nindent 8 }}
      {{- if eq $name "web" }}
      annotations:
        # 로그인 설정 값이 바뀌면 web 파드를 새로 띄움 (subPath 마운트는 자동 갱신되지 않음)
        checksum/auth-config: {{ include (print $root.Template.BasePath "/web-auth-config.yaml") $root | sha256sum }}
      {{- end }}
    spec:
      serviceAccountName: keeper-{{ $name }}
      {{- if $root.Values.rollout.enabled }}
      terminationGracePeriodSeconds: {{ $root.Values.rollout.terminationGracePeriodSeconds }}
      {{- end }}
      # 노드 두 대(AZ 두 곳)에 나눠 배치
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: keeper-{{ $name }}
      # Pod Security 'restricted' 기준을 만족하는 설정
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ include "keeper.image" (list $root $name) }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $app.port }}
          env:
            - name: PORT
              value: {{ $app.port | quote }}
            {{- if ne $name "web" }}
            - name: AWS_REGION
              value: {{ $root.Values.aws.region | quote }}
            - name: DB_HOST
              value: {{ $root.Values.aws.dbHost | quote }}
            - name: DB_NAME
              value: {{ $root.Values.aws.dbName | quote }}
            - name: DB_SECRET_ARN        # 비밀번호 값이 아니라 위치만 전달. 파드가 IRSA로 직접 읽음
              value: {{ $root.Values.aws.dbSecretArn | quote }}
            - name: APP_SECRET_ARN
              value: {{ $root.Values.aws.appSecretArn | quote }}
            {{- end }}
            {{- if eq $name "api" }}
            - name: VAULT_URL
              value: "http://keeper-vault:{{ $root.Values.apps.vault.port }}"
            - name: COGNITO_USER_POOL_ID
              value: {{ $root.Values.cognito.userPoolId | quote }}
            - name: COGNITO_CLIENT_ID
              value: {{ $root.Values.cognito.clientId | quote }}
            {{- end }}
            {{- if eq $name "vault" }}
            - name: DOC_BUCKET
              value: {{ $root.Values.aws.documentBucket | quote }}
            - name: KMS_KEY_ARN
              value: {{ $root.Values.aws.kmsKeyArn | quote }}
            {{- end }}
          {{- if $root.Values.rollout.enabled }}
          # 종료 신호를 받으면 바로 끄지 않고 기다림 → ALB가 대상에서 뺄 시간을 줌
          # (쿠버네티스 내장 sleep 동작이라 이미지에 sleep 명령이 없어도 됨. 1.30 이상)
          lifecycle:
            preStop:
              sleep:
                seconds: {{ $root.Values.rollout.preStopSleepSeconds }}
          {{- end }}
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml $app.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if and (eq $name "web") $root.Values.cognito.loginDomain $root.Values.cognito.clientId }}
            # 화면의 로그인 설정을 ConfigMap 값으로 덮어씀 (비어 있으면 이미지 안의 빈 파일 → 체험 모드)
            - name: auth-config
              mountPath: /usr/share/nginx/html/js/auth-config.js
              subPath: auth-config.js
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if and (eq $name "web") $root.Values.cognito.loginDomain $root.Values.cognito.clientId }}
        - name: auth-config
          configMap:
            name: keeper-web-auth-config
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: keeper-{{ $name }}
  labels:
    {{- include "keeper.labels" $root | nindent 4 }}
spec:
  selector:
    app: keeper-{{ $name }}
  ports:
    - name: http
      port: {{ $app.port }}
      targetPort: http
{{- end }}
