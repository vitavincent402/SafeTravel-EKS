apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keeper
  labels:
    {{- include "keeper.labels" . | nindent 4 }}
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip              # ALB → 파드 IP로 직접 (NetworkPolicy가 ALB 대역을 허용)
    alb.ingress.kubernetes.io/group.name: keeper           # Terraform이 이 이름으로 ALB를 찾아 DNS를 연결
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    {{- with .Values.ingress.accessLogBucket }}
    # ALB 접속 로그. 버킷은 persistent/에 있고 ALB 쓰기를 허용하는 정책이 있어야 한다
    alb.ingress.kubernetes.io/load-balancer-attributes: access_logs.s3.enabled=true,access_logs.s3.bucket={{ . }},access_logs.s3.prefix=alb
    {{- end }}
    {{- with .Values.ingress.wafAclArn }}
    alb.ingress.kubernetes.io/wafv2-acl-arn: {{ . }}
    {{- end }}
    {{- if .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/certificate-arn: {{ .Values.ingress.certificateArn }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/ssl-policy: ELBSecurityPolicy-TLS13-1-2-2021-06
    {{- else }}
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    {{- end }}
spec:
  ingressClassName: alb
  rules:
    {{- range $host := (.Values.ingress.hosts | default (list "")) }}
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: keeper-api
                port: { number: {{ $.Values.apps.api.port }} }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keeper-web
                port: { number: {{ $.Values.apps.web.port }} }
      {{- if $host }}
      host: {{ $host | quote }}
      {{- end }}
    {{- end }}
