{{- /* 화면(web)의 Cognito 로그인 설정. 비밀값이 아니다(브라우저에 공개되는 로그인 주소·공개 앱 클라이언트 ID).
       앱 클라이언트는 시크릿 없는 공개 클라이언트(Authorization Code + PKCE)라 ConfigMap으로 충분하다 (SOC 확인).
       값은 Terraform이 persistent/ 출력으로 채운 cognito.loginDomain / cognito.clientId. 둘 중 하나라도 비면 만들지 않는다. */ -}}
{{- if and .Values.cognito.loginDomain .Values.cognito.clientId }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: keeper-web-auth-config
  labels:
    {{- include "keeper.labels" . | nindent 4 }}
data:
  auth-config.js: |
    /* 배포 때 차트가 만든 파일 (charts/keeper/templates/web-auth-config.yaml). 직접 고치지 않는다. */
    window.ST_AUTH = {
        domain: {{ .Values.cognito.loginDomain | trimSuffix "/" | toJson }},
        clientId: {{ .Values.cognito.clientId | toJson }},
        scope: "openid email profile",
        redirectPath: "/auth/callback.html",
        logoutPath: "/"
    };
{{- end }}
